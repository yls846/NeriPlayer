name: Fork release APK

on:
  push:
    branches:
      - feat/lyrico-external-tag-edit
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.caching=true
  FORK_KEY_ALIAS: neri
  FORK_KEY_PASSWORD: neriforkrelease

jobs:
  build-release-apk:
    name: Build release APK (coexisting package)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Install Android NDK
        uses: ./.github/actions/android-ndk

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$dir/neri.jks"
            echo "using keystore from repository secret"
            echo "KEYSTORE_FROM_SECRET=true" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -noprompt \
              -keystore "$dir/neri.jks" -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -alias "$FORK_KEY_ALIAS" \
              -storepass "$FORK_KEY_PASSWORD" -keypass "$FORK_KEY_PASSWORD" \
              -dname "CN=NeriPlayer Fork, OU=Personal, O=Personal, L=Personal, ST=Personal, C=CN"
            echo "no KEYSTORE_BASE64 secret: generated a new keystore"
            echo "KEYSTORE_FROM_SECRET=false" >> "$GITHUB_ENV"
          fi
          echo "FORK_KEYSTORE=$dir/neri.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PforkRelease=true \
            -PKEYSTORE_FILE="$FORK_KEYSTORE" \
            -PKEYSTORE_PASSWORD="$FORK_KEY_PASSWORD" \
            -PKEY_ALIAS="$FORK_KEY_ALIAS" \
            -PKEY_PASSWORD="$FORK_KEY_PASSWORD" \
            --warning-mode all --stacktrace

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: neriplayer-fork-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload generated keystore
        if: env.KEYSTORE_FROM_SECRET == 'false'
        uses: actions/upload-artifact@v6
        with:
          name: signing-keystore
          path: ${{ env.FORK_KEYSTORE }}
          if-no-files-found: error
          retention-days: 14
